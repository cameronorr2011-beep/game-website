name: build-published-apps

# Builds the downloadable desktop artifact on every change to it, then
# publishes to the `apps` GitHub Release with stable asset names:
#   https://github.com/cameronorr2011-beep/game-website/releases/download/apps/NeuroML-Windows-Setup.exe
#   https://github.com/cameronorr2011-beep/game-website/releases/download/apps/NeuroML-Windows-Portable.exe
#
# v31: the MOBILE APP IS SCRATCHED (owner decision — computer-only operation).
# The android-apk job was removed. The android/ source code stays in the repo
# untouched (nothing destroys it), and the last published v30 APK remains on
# the `apps` release; restoring the job is a git revert of this file.

on:
  push:
    branches: [main]
    paths:
      - "electron_app/**"
      - "public_gui/**"
      - "api/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # electron-builder unpacks its signing/edit tool suite, which contains
      # symlinks — needs Windows Developer Mode (or admin symlink privilege).
      - name: Enable Windows Developer Mode (symlinks for electron-builder)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
        shell: cmd

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Electron app (installer + portable)
        working-directory: electron_app
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win
        shell: bash

      - name: Stage EXEs
        run: |
          mkdir -p dist
          cp electron_app/dist/*.exe dist/ 2>/dev/null || true
          ls -lh dist
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroML-Windows
          path: dist/*.exe

      - name: Publish to stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: NeuroML published apps
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
