name: build-published-apps

# Builds the two downloadable "not-localhost" artifacts on every change to
# them, then publishes to the `apps` GitHub Release with stable asset names:
#   https://github.com/cameronorr2011-beep/game-website/releases/download/apps/NeuroML-Android.apk
#   https://github.com/cameronorr2011-beep/game-website/releases/download/apps/NeuroML-Windows-Setup.exe
#   https://github.com/cameronorr2011-beep/game-website/releases/download/apps/NeuroML-Windows-Portable.exe

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "electron_app/**"
      - "public_gui/**"
      - "api/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Chaquopy resolves its build tooling with buildPython, which must be
      # >= 3.10 even when the APP targets Python 3.8 (for the torch 1.8.1
      # arm64 Android wheels). Install 3.8 last so `python3` stays 3.8, and
      # give buildPython an explicit 3.10 path via python2/python resolution.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"   # target version of the brain in the APK
      - uses: actions/setup-python@v5
        id: pyhost
        with:
          python-version: "3.10"  # buildPython host interpreter for Chaquopy

      - name: Set up Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "7.6"

      - name: Build debug-signed APK (full brain inside)
        run: gradle -p android -PchaquopyBuildPython="${{ steps.pyhost.outputs.python-path }}" assembleDebug --no-daemon --stacktrace
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.pyhost.outputs.python-path }}

      - name: Stage APK
        # NeuroML-version.txt (e.g. "27.0") is the auto-update marker the app
        # polls; NeuroML-Android.apk keeps its stable download name so the
        # URL from before never changes.
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NeuroML-Android.apk
          VER=$(grep -oE 'versionName "[0-9.]+"' android/app/build.gradle | head -1 | grep -oE '[0-9]+[.][0-9]+' | head -1)
          test -n "$VER" && echo "$VER" > dist/NeuroML-version.txt
          echo "apk version: $VER"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroML-Android.apk
          path: dist/NeuroML-Android.apk

      - name: Publish to stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: NeuroML published apps
          draft: false
          prerelease: false
          files: |
            dist/NeuroML-Android.apk
            dist/NeuroML-version.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # electron-builder unpacks its signing/edit tool suite, which contains
      # symlinks — needs Windows Developer Mode (or admin symlink privilege).
      - name: Enable Windows Developer Mode (symlinks for electron-builder)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
        shell: cmd

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Electron app (installer + portable)
        working-directory: electron_app
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win
        shell: bash

      - name: Stage EXEs
        run: |
          mkdir -p dist
          cp electron_app/dist/*.exe dist/ 2>/dev/null || true
          ls -lh dist
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroML-Windows
          path: dist/*.exe

      - name: Publish to stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: NeuroML published apps
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
