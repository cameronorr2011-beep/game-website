[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-ml-research"
version = "0.1.0"
description = "Provenance-first sparse connectome simulation research foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "scipy>=1.12,<2", "pyarrow>=16,<24", "psutil>=5.9,<8"]

[project.scripts]
neuro-ml = "neuro_ml.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuro_ml*"]
exclude = ["legacy*", "datasets*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
